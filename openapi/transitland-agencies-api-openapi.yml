openapi: 3.2.0
info:
  title: Transitland Agencies API
  version: 2.0.0
  contact:
    email: info@interline.io
  description: 'Operations tagged Agencies across 2 of this provider''s published API definitions: transitland-rest-openapi.json, transitland-rest-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Transitland REST API
  url: https://transit.land/api/v2/rest
tags:
- name: Agencies
paths:
  /agencies:
    get:
      parameters:
      - description: Agency lookup key; can be an integer ID, a '<feed onestop_id>:<gtfs agency_id>' key, or a Onestop ID
        in: query
        name: agency_key
        schema:
          type: string
      - description: Search for records with this GTFS agency_id (string)
        in: query
        name: agency_id
        schema:
          type: string
      - description: Search for records with this GTFS agency_name
        in: query
        name: agency_name
        schema:
          type: string
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/includeAlertsParam'
      - $ref: '#/components/parameters/includeRoutesParam'
      - $ref: '#/components/parameters/afterParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/formatParam'
      - $ref: '#/components/parameters/searchParam'
      - $ref: '#/components/parameters/onestopParam'
      - $ref: '#/components/parameters/sha1Param'
      - $ref: '#/components/parameters/feedParam'
      - $ref: '#/components/parameters/radiusParam'
        x-description: Search for agencies geographically, based on stops at this location; radius is in meters, requires lon and lat
      - $ref: '#/components/parameters/lonParam'
      - $ref: '#/components/parameters/latParam'
      - $ref: '#/components/parameters/bboxParam'
      - $ref: '#/components/parameters/adm0NameParam'
      - $ref: '#/components/parameters/adm0IsoParam'
      - $ref: '#/components/parameters/adm1NameParam'
      - $ref: '#/components/parameters/adm1IsoParam'
      - $ref: '#/components/parameters/cityNameParam'
      - $ref: '#/components/parameters/licenseCommercialUseAllowedParam'
      - $ref: '#/components/parameters/licenseShareAlikeOptionalParam'
      - $ref: '#/components/parameters/licenseCreateDerivedProductParam'
      - $ref: '#/components/parameters/licenseRedistributionAllowedParam'
      - $ref: '#/components/parameters/licenseUseWithoutAttributionParam'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  agencies:
                    description: List or search for Agencies (each an `agency.txt` record from a specific FeedVersion); defaults to currently active feed versions when none is specified
                    items:
                      properties:
                        agency_email:
                          description: GTFS `agency.agency_email`; email address actively monitored by the agency's customer service department
                          format: email
                          title: agency_email
                          type:
                          - string
                          - 'null'
                          x-order: 20
                        agency_fare_url:
                          description: GTFS `agency.agency_fare_url`; URL of a web page where a rider can purchase tickets or passes
                          title: agency_fare_url
                          type:
                          - string
                          - 'null'
                          x-order: 18
                        agency_id:
                          description: GTFS `agency.agency_id`
                          title: agency_id
                          type: string
                          x-order: 6
                        agency_lang:
                          description: GTFS `agency.agency_lang`; primary language used by this transit agency, as a BCP 47 language tag
                          title: agency_lang
                          type:
                          - string
                          - 'null'
                          x-order: 14
                        agency_name:
                          description: GTFS `agency.agency_name`
                          title: agency_name
                          type: string
                          x-order: 4
                        agency_phone:
                          description: GTFS `agency.agency_phone`; voice telephone number for the agency's customer service
                          title: agency_phone
                          type:
                          - string
                          - 'null'
                          x-order: 16
                        agency_timezone:
                          description: GTFS `agency.agency_timezone`; stop times use this timezone unless overridden by `stop_timezone`
                          title: agency_timezone
                          type: string
                          x-order: 12
                        agency_url:
