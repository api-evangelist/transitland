    servers:
    - description: Transitland REST API
      url: https://transit.land/api/v2/rest
  /routes/{route_key}/trips/{id}:
    get:
      parameters:
      - description: Route lookup key; can be an integer ID, a '<feed onestop_id>:<gtfs route_id>' key, or a Onestop ID
        in: path
        name: route_key
        required: true
        schema:
          type: string
      - description: Trip ID
        in: path
        name: id
        required: true
        schema:
          type: integer
      - description: Include shape geometry
        in: query
        name: include_geometry
        schema:
          enum:
          - 'true'
          - 'false'
          type: string
      - $ref: '#/components/parameters/includeAlertsParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/formatParam'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  trips:
                    description: List or search for Trips
                    items:
                      properties:
                        alerts:
                          description: 'GTFS-RT service alerts on this trip, whose agency, route and mode, if given, are the trip''s; pass `active: true` to return only currently active alerts'
                          items:
                            properties:
                              active_period:
                                description: Time ranges during which this alert is active. See https://gtfs.org/realtime/reference/#message-timerange
                                items:
