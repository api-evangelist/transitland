openapi: 3.2.0
info:
  title: Transitland Routes API
  version: 2.0.0
  contact:
    email: info@interline.io
  description: 'Operations tagged Routes across 2 of this provider''s published API definitions: transitland-rest-openapi.json, transitland-rest-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Transitland REST API
  url: https://transit.land/api/v2/rest
tags:
- name: Routes
paths:
  /routes:
    get:
      parameters:
      - description: Route lookup key; can be an integer ID, a '<feed onestop_id>:<gtfs route_id>' key, or a Onestop ID
        in: query
        name: route_key
        schema:
          type: string
      - description: Agency lookup key; can be an integer ID, a '<feed onestop_id>:<gtfs agency_id>' key, or a Onestop ID
        in: query
        name: agency_key
        schema:
          type: string
      - description: Search for records with this GTFS route_id
        in: query
        name: route_id
        schema:
          type: string
      - description: Search for routes with this GTFS route (vehicle) type
        in: query
        name: route_type
        schema:
          type: integer
      - description: Search for routes with these GTFS route (vehicle) types. Accepts comma separated values.
        in: query
        name: route_types
        schema:
          type: string
      - description: Search for records by operator OnestopID
        in: query
        name: operator_onestop_id
        schema:
          type: string
      - description: Search for routes serving a stop with this OnestopID
        in: query
        name: serves_stop_onestop_id
        schema:
          type: string
      - $ref: '#/components/parameters/includeAlertsParam'
      - description: Include route geometry
        in: query
        name: include_geometry
        schema:
          enum:
          - 'true'
          - 'false'
          type: string
      - description: Include route stops
        in: query
        name: include_stops
        schema:
          enum:
          - 'true'
          - 'false'
          type: string
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/afterParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/formatParam'
      - $ref: '#/components/parameters/searchParam'
      - $ref: '#/components/parameters/onestopParam'
      - $ref: '#/components/parameters/sha1Param'
      - $ref: '#/components/parameters/feedParam'
      - $ref: '#/components/parameters/radiusParam'
        x-description: Search for routes geographically, based on stops at this location; radius is in meters, requires lon and lat
      - $ref: '#/components/parameters/latParam'
      - $ref: '#/components/parameters/lonParam'
      - $ref: '#/components/parameters/bboxParam'
      - $ref: '#/components/parameters/licenseCommercialUseAllowedParam'
      - $ref: '#/components/parameters/licenseShareAlikeOptionalParam'
      - $ref: '#/components/parameters/licenseCreateDerivedProductParam'
      - $ref: '#/components/parameters/licenseRedistributionAllowedParam'
      - $ref: '#/components/parameters/licenseUseWithoutAttributionParam'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  routes:
                    description: List or search for Routes
                    items:
                      properties:
                        agency:
                          description: Agency associated with this route
                          properties:
                            agency_id:
                              description: GTFS `agency.agency_id`
                              title: agency_id
                              type: string
                              x-order: 112
                            agency_name:
                              description: GTFS `agency.agency_name`
                              title: agency_name
                              type: string
                              x-order: 114
                            alerts:
                              description: 'GTFS-RT service alerts on this agency as a whole, not those narrowed to a route, stop or trip; pass `active: true` to return only currently active alerts, and `include_modes: true` to also return alerts on a mode the agency runs, such as all of its subway service'
                              items:
                                properties:
                                  active_period:
                                    description: Time ranges during which this alert is active. See https://gtfs.org/realtime/reference/#message-timerange
                                    items:
                                      properties:
                                        end:
                                          description: End of the range, in Unix epoch seconds
                                          title: end
                                          type:
                                          - integer
                                          - 'null'
                                          x-order: 163
                                        start:
                                          description: Start of the range, in Unix epoch seconds
                                          title: start
                                          type:
                                          - integer
                                          - 'null'
                                          x-order: 161
                                      type: object
                                      x-graphql-type: RTTimeRange
                                    title: active_period
                                    type:
                                    - array
                                    - 'null'
                                    x-order: 164
                                  cause:
                                    description: GTFS-RT Alert [cause](https://gtfs.org/realtime/reference/#enum-cause)
                                    externalDocs:
                                      description: cause
                                      url: https://gtfs.org/realtime/reference/#enum-cause
                                    title: cause
                                    type:
                                    - string
                                    - 'null'
                                    x-order: 124
                                  description_text:
                                    description: GTFS-RT Alert description text
                                    items:
                                      properties:
                                        language:
