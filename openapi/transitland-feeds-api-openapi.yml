                                description: URL used to fetch the file
                                title: url
                                type: string
                                x-order: 91
                            type: object
                            x-graphql-type: FeedVersion
                          title: feed_versions
                          type: array
                          x-order: 96
                        id:
                          description: Internal integer ID
                          title: id
                          type: integer
                          x-order: 2
                        languages:
                          description: Language(s) included in this feed (BCP 47 tags)
                          items:
                            type: string
                          title: languages
                          type:
                          - array
