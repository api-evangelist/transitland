              schema:
                $ref: '#/components/schemas/PlanResponse'
          description: Successful routing plan response.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Invalid request parameters: a missing `fromPlace` or `toPlace`, a place, `date`, `time` or `relative_date` that does not parse, a `date` or `relative_date` without a `time`, both `date` and `relative_date`, `arriveBy` without a `time`, a `walkingSpeed` that is not positive, an origin (a destination, with `arriveBy`) outside every time zone, or `realtimeOnly` with `ignoreRealtimeUpdates` or on a server that applies no realtime updates.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing or invalid API key.
        '429':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/LimitExceeded'
                - $ref: '#/components/schemas/GatewayError'
          description: Rate limit or usage limit reached. The edge proxy answers its own rate limit with a JSON `message`; this API answers a usage limit with the meter, the limit and links to plans.
