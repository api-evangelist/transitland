openapi: 3.2.0
info:
  title: Transitland Transit routing API
  version: 1.0.0
  contact:
    email: info@interline.io
  description: 'Operations tagged Transit routing across 2 of this provider''s published API definitions: transitland-routing-openapi.json, transitland-routing-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Interline Routing Platform
  url: https://transit.land/api/v2/routing
security:
- apikeyHeader: []
- apikeyQuery: []
tags:
- description: Transit and walking itineraries from the Transitland Routing API.
  name: Transit routing
paths:
  /otp/plan:
    get:
      description: Returns transit and walking route itineraries between the specified origin and destination. The endpoint accepts parameters to control departure/arrival times, walking distances, transit leg limits, transfer penalties, and more.
      operationId: otpPlan
      parameters:
      - description: Origin in `lat,lon` format.
        in: query
        name: fromPlace
        required: true
        schema:
          example: 37.7757,-122.4198
          type: string
      - description: Destination in `lat,lon` format.
        in: query
        name: toPlace
        required: true
        schema:
          example: 37.7857,-122.4064
          type: string
      - description: 'Time of departure (or arrival if `arriveBy` is true) in local time at the origin (at the destination if `arriveBy` is true). Format: `HH:MM` or `HH:MM:SS` on a 24-hour clock, up to `48:00:00`. A time past `24:00` continues into the next day, so `25:30` is 01:30 the day after. A 12-hour time such as `8:30am` is rejected. When `time`, `date` and `relative_date` are all omitted, the request plans from now; `time` alone is that time today. Required when `date` or `relative_date` is given, and when `arriveBy` is true.'
        in: query
        name: time
        schema:
          example: 08:30
          pattern: ^\d{1,2}:[0-5]\d(:[0-5]\d)?$
          type: string
      - description: Date of travel in `YYYY-MM-DD` format. `MM-DD-YYYY` is also accepted, with the month first. Defaults to today in the time zone of the origin (of the destination if `arriveBy` is true). Requires `time`. Cannot be combined with `relative_date`.
        in: query
        name: date
        schema:
          example: '2026-08-17'
          pattern: ^(\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])|(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])-\d{4})$
          type: string
      - description: Date of travel relative to today in the time zone of the origin (of the destination if `arriveBy` is true), instead of `date`. `TODAY`, `YESTERDAY` or `TOMORROW`. `MONDAY` through `SUNDAY` is the next such day, or today if today is that day. `NEXT_MONDAY` through `NEXT_SUNDAY` is the next such day after today. Also accepted as `relativeDate`. Requires `time`.
        in: query
        name: relative_date
        schema:
          enum:
          - TODAY
          - YESTERDAY
          - TOMORROW
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
          - SATURDAY
          - SUNDAY
          - NEXT_MONDAY
          - NEXT_TUESDAY
          - NEXT_WEDNESDAY
          - NEXT_THURSDAY
          - NEXT_FRIDAY
          - NEXT_SATURDAY
          - NEXT_SUNDAY
          example: TOMORROW
          type: string
      - description: If true, the specified `time` and `date` are treated as the target arrival time at the destination rather than the departure time. Requires `time`.
        in: query
        name: arriveBy
        schema:
          default: false
          example: false
          type: boolean
      - description: Maximum number of itineraries to return. Also available as `numItineraries`.
        in: query
        name: maxItineraries
        schema:
          default: 10
          example: 3
          type: integer
      - description: Maximum walking distance (in meters) allowed from the origin to the first transit stop or from the last transit stop to the destination. Also available as `maxWalkDistance`.
        in: query
        name: maxWalkingDistance
        schema:
          default: 800
          example: 800
          type: number
      - description: Maximum straight-line distance (in meters) allowed for transfers between stops.
        in: query
        name: maxTransferWalkingDistance
        schema:
          default: 400
          example: 400
          type: number
      - description: Walking speed in meters per second. (Fixed at 1.0 in the beta release.)
        in: query
        name: walkingSpeed
        schema:
          default: 1
          example: 1
          type: number
          exclusiveMinimum: 0
      - description: Minimum duration (in seconds) of a transit leg.
        in: query
        name: minRideLength
        schema:
          default: 120
          example: 120
          type: integer
      - description: Maximum number of transit legs allowed in an itinerary.
        in: query
        name: maxK
        schema:
          default: 8
          example: 8
          type: integer
      - description: Maximum total itinerary time (in seconds).
        in: query
        name: maxTripTime
        schema:
          default: 14400
          example: 14400
          type: integer
      - description: Amount of padding to add (in seconds) when considering a transfer. For example, when alighting from the end of the first transit leg and walking to the departure stop for the next leg, only transfers to new trips departing at least 120s from that moment will be considered
        in: query
        name: transferTimePenalty
        schema:
          default: 120
          example: 120
          type: integer
      - description: Use "fallback" service dates if the requested date is outside the service period of a given feed. For instance, if a feed only contains service from 2023-01-01 through 2023-01-31, and a date of 2023-05-01 is specified, an equivalent weekday (in this case, Monday) will be selected within the valid service range, such as 2023-01-09.
        in: query
        name: useFallbackDates
        schema:
          default: true
          example: true
          type: boolean
      - description: Always include a walking-only itinerary alongside transit results.
        in: query
        name: includeWalkingItinerary
        schema:
          default: false
          example: false
          type: boolean
      - description: Return a walking-only itinerary if no transit trips are found.
        in: query
        name: fallbackWalkingItinerary
        schema:
          default: false
          example: false
          type: boolean
      - description: Automatically include a walking-only itinerary if the origin and destination are within the maximum walking distance.
        in: query
        name: allowWalkingItinerary
        schema:
          default: false
          example: false
          type: boolean
      - description: Include a table of the earliest arrival times at stops during trip planning.
        in: query
        name: includeEarliestArrivals
        schema:
          default: false
          example: false
          type: boolean
      - description: If true, stops that cannot improve the final arrival time are ignored. Set to false to include all stops, useful for generating isochrones.
        in: query
        name: useTargetStopPruning
        schema:
          default: true
          example: true
          type: boolean
      - description: If true, the plan uses the schedule alone, without the realtime trip updates the server applies.
        in: query
        name: ignoreRealtimeUpdates
        schema:
          default: false
          example: false
          type: boolean
      - description: If true, the plan rides only trips that a realtime trip update matches, whatever the update predicts. Cannot be combined with `ignoreRealtimeUpdates`.
        in: query
        name: realtimeOnly
        schema:
          default: false
          example: false
          type: boolean
      - description: If true, each transit leg whose run a trip update matched also carries `realtimeDebug`, the update's trip descriptor, and each of its stops carries its scheduled departure, the source of its departure, and the stop time update placed there.
        in: query
        name: debugRealtime
        schema:
          default: false
          example: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  summary: A trip with one rail leg
                  value:
                    plan:
                      date: 1786980600000
                      from:
                        lat: 37.7757
                        lon: -122.4198
                        name: Origin
                      itineraries:
                      - distance: 1840.6016926765926
