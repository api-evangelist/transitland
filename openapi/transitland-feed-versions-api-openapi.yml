openapi: 3.2.0
info:
  title: Transitland Feed Versions API
  version: 2.0.0
  contact:
    email: info@interline.io
  description: 'Operations tagged Feed Versions across 2 of this provider''s published API definitions: transitland-rest-openapi.json, transitland-rest-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Transitland REST API
  url: https://transit.land/api/v2/rest
tags:
- name: Feed Versions
paths:
  /feed_versions:
    get:
      parameters:
      - description: Feed version lookup key; can be an integer ID or a SHA1 value
        in: query
        name: feed_version_key
        schema:
          type: string
      - description: Feed lookup key; can be an integer ID or Onestop ID
        in: query
        name: feed_key
        schema:
          type: string
      - description: Feed version SHA1
        in: query
        name: sha1
        schema:
          type: string
      - description: Feed version SHA1 of the top-level .txt files (sha1_dir)
        in: query
        name: sha1_dir
        schema:
          type: string
      - description: Feed OnestopID
        in: query
        name: feed_onestop_id
        schema:
          type: string
      - description: Filter for feed versions fetched earlier than given date time in UTC
        in: query
        name: fetched_before
        schema:
          format: datetime
          type: string
      - description: Filter for feed versions fetched since given date time in UTC
        in: query
        name: fetched_after
        schema:
          format: datetime
          type: string
      - $ref: '#/components/parameters/idParam'
      - $ref: '#/components/parameters/afterParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/formatParam'
      - $ref: '#/components/parameters/radiusParam'
        x-description: Search for feed versions geographically; radius is in meters, requires lon and lat
