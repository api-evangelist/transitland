name: TransitLand
description: Transitland is an open, community-edited aggregation of public transit
  data from GTFS and GTFS Realtime feeds around the world, operated by Interline Technologies.
  It offers a REST API and a GraphQL API over agencies, routes, stops, trips, feeds
  and feed versions, real-time departures, plus the Interline Routing Platform for
  transit and street routing, isochrones and matrices.
